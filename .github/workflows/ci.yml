name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest

      - name: Run unit tests
        run: python3 -m pytest tests/ -q

      - name: Run code style check
        run: |
          python3 -m compileall -q scripts run_tests.py || exit 1
          echo "所有脚本语法检查通过"

      - name: Fetch data sources
        run: python3 scripts/generate.py fetch

      - name: Generate and validate
        run: |
          python3 scripts/generate.py generate
          python3 scripts/generate.py validate

      - name: Verify determinism (无差异 = 幂等)
        run: |
          python3 scripts/generate.py generate
          find ruleset -type f ! -name metadata.json -exec md5sum {} + | md5sum > /tmp/hash1
          python3 scripts/generate.py generate
          find ruleset -type f ! -name metadata.json -exec md5sum {} + | md5sum > /tmp/hash2
          diff /tmp/hash1 /tmp/hash2 && echo "生成结果幂等性验证通过"
